<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-df345c88-a59e-426f-b6ab-9efa588635c4/styles.css">
<script src="_ds/industry-df345c88-a59e-426f-b6ab-9efa588635c4/_ds_bundle.js"></script>
<style>
  :root{--color-accent:#0E7A43;--color-accent-100:#E4F0E9;--color-accent-200:#C8E1D3;--color-accent-300:#9FDCB8;--color-accent-400:#3E9C63;--color-accent-500:#0E7A43;--color-accent-600:#0A5F36;--color-accent-700:#0A4F2E;--color-accent-800:#084026;--color-accent-900:#05331f;--color-accent-2:#0E7A43;--color-accent-2-100:#E4F0E9;--color-accent-2-700:#0A4F2E;}
  body{margin:0;}
  a{color:var(--color-accent-700);text-decoration:none;}
  a:hover{color:var(--color-accent);}
  /* Coins arrondis - UI plus approchable */
  .btn{border-radius:10px !important;}
  .blueprint{border-radius:16px !important;}
  .card{border-radius:16px !important;}
  .tag{border-radius:999px !important;}
  .input{border-radius:10px !important;}
  .blueprint img, main img{border-radius:9px;}
  .corner{display:none !important;}
</style>
</helmet>
<header style="position:sticky;top:0;z-index:50;background:rgba(242,242,243,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--color-neutral-300,rgba(29,31,32,.16));">
  <div style="max-width:1200px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;">
    <a href="Accueil.dc.html" style="display:flex;align-items:center;gap:10px;flex:none;">
      <img src="./assets/djate-logo.png" alt="Djaté POS" style="height:40px;width:auto;display:block;">
      <span style="font:600 26px var(--font-heading);letter-spacing:-.01em;color:var(--color-text);line-height:1;">Djaté POS</span>
    </a>
    <nav style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-left:auto;">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
        <a href="{{ l.href }}" style="position:relative;font:600 17px var(--font-heading);letter-spacing:.03em;text-transform:uppercase;color:var(--color-text);padding:8px 12px;">
          {{ l.label }}
          <sc-if value="{{ l.cur }}"><span style="position:absolute;left:12px;right:12px;bottom:2px;height:2px;background:var(--color-accent);"></span></sc-if>
        </a>
      </sc-for>
    </nav>
    <a href="Contact.dc.html" class="btn btn-primary" style="flex:none;font-size:16px;padding:12px 22px;white-space:nowrap;">Demander une démo</a>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:72},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;accueil&quot;,&quot;options&quot;:[&quot;accueil&quot;,&quot;application&quot;,&quot;formations&quot;,&quot;contact&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const items = [
      {label:'Accueil', href:'Accueil.dc.html', key:'accueil'},
      {label:'Fonctionnalités', href:'Application.dc.html', key:'application'},
      {label:'Vidéos', href:'Formations.dc.html', key:'formations'},
      {label:'Contact', href:'Contact.dc.html', key:'contact'},
    ];
    const active = this.props.active || 'accueil';
    return { links: items.map(i => ({ label:i.label, href:i.href, cur: i.key === active })) };
  }
}
</script>
</body>
</html>
